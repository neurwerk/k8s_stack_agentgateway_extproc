name: Architecture proposal
description: Discuss a design decision
labels:
  - "type: architecture"
body:
  - type: textarea
    id: decision
    attributes:
      label: What decision is needed, and why?
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Suggested approach (optional)
      description: Share an idea or relevant links if you have them. It is fine to leave the solution open.
